name: IndexNow ping

# After each push to main, wait for the Vercel deploy, then tell Bing (and
# other IndexNow engines, which feed ChatGPT search and Copilot) which URLs exist.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deploy
        run: sleep 150
      - name: Submit sitemap URLs to IndexNow
        env:
          KEY: f9bda21c3bd637dd4370efc8e8b22013
          HOST: www.brightautomations.org
        run: |
          set -euo pipefail
          URLS=$(curl -fsSL "https://$HOST/sitemap.xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | head -10000)
          JSON=$(printf '%s\n' "$URLS" | jq -R . | jq -s --arg host "$HOST" --arg key "$KEY" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: .}')
          echo "Submitting $(printf '%s\n' "$URLS" | wc -l) URLs"
          curl -sS -o /dev/null -w "IndexNow responded %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$JSON"
